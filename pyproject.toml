[project]
name = "monitoreo-pediatria"
version = "1.0.6"
description = "Dashboard de monitoreo pediatrico en tiempo real"
requires-python = ">=3.9"

# Dependencias que 'flet build' empaqueta DENTRO del APK.
# OJO: el build las toma de aquí, NO de requirements.txt. Si una libreria
# no esta en esta lista, no viaja al telefono (ej: flet_audio faltaba).
dependencies = [
    "flet",
    "flet-webview",
    "flet-audio",
    "flet-android-notifications==0.7.3",  # fijada: compatible con Python 3.10 del venv
    "paho-mqtt",
]

[tool.flet]
# Identidad fija de la app → nombre de paquete estable (com.chuy.monitoreo_pediatria).
# Con esto, cada build futuro ACTUALIZA la misma app en vez de instalar una nueva.
org = "com.chuy"
product = "Monitoreo Pediatria"
# versionCode de Android. El ultimo APK (1.0.5) salio con versionCode 1 (sin
# este campo, el default de la plantilla). Subirlo en CADA build publicado,
# junto con [project] version y datos/version.py.
build_number = 2

[tool.flet.android.permission]
# Fase 1 de notificaciones: permiso para publicar notificaciones (Android 13+).
"android.permission.POST_NOTIFICATIONS" = true
# Fase 2: foreground service para mantener viva la app en segundo plano.
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true

[tool.flet.android.manifest_application]
# Permite trafico HTTP sin cifrar (http://) en Android — necesario para que
# el WebView cargue el player.html y el WHEP por http dentro de Tailscale.
usesCleartextTraffic = "true"
